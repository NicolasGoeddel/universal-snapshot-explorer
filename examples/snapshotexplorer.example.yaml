roots:
  backup-pi:
    root_path: /data/backups
    sub_path: backup-pi
    user_map: etc/passwd
    group_map: etc/group
    snapshot_patterns:
      - "auto-%Y-%m-%d_%H-%M*"
  Backup Rocky:
    root_path: /data/backups
    sub_path: Rocky
    user_map: etc/passwd
    group_map: etc/group
    snapshot_patterns:
      - "auto-%Y-%m-%d_%H-%M*"
  backup-server:
    root_path: /data/backups
    sub_path: backup-server
    user_map: etc/passwd
    group_map: etc/group
    snapshot_patterns:
      - "auto-%Y-%m-%d_%H-%M*"
loglevel: info

# Optional: authenticated access with real POSIX ACL enforcement, uses the container NSS stack for resolving user and group.
# Disabled by default, see docs/configuration-guide.md.
# security:
#   enabled: true
#   trusted_user_header: Remote-User
#   # Optional: for a standalone instance with no fronting auth proxy, impersonate
#   # the union of these users' permissions instead of denying anonymous requests.
#   impersonate_users:
#     - alice
#     - bob