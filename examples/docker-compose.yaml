version: '3.8'

services:
  universal_snapshot_explorer:
    image: ghcr.io/nicolasgoeddel/universal-snapshot-explorer:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
