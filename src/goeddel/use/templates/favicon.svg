<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background disk -->
  <rect x="15" y="25" width="70" height="50" rx="10" ry="10" fill="url(#grad)" />
  <line x1="25" y1="50" x2="75" y2="50" stroke="white" stroke-width="4" stroke-opacity="0.3" />
  <!-- Overlapping snapshots (cards) -->
  <rect x="20" y="20" width="60" height="10" rx="5" ry="5" fill="#bae6fd" opacity="0.6"/>
  <rect x="25" y="15" width="50" height="10" rx="5" ry="5" fill="#e0f2fe" opacity="0.4"/>
  <!-- Camera lens in the middle -->
  <circle cx="50" cy="50" r="16" fill="#0f172a" />
  <circle cx="50" cy="50" r="12" fill="white" />
  <circle cx="50" cy="50" r="8" fill="#0ea5e9" />
</svg>
