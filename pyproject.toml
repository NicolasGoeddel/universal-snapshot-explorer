[project]
name = "universal-snapshot-explorer"
version = "2.0.1"
description = "Universal Snapshot Explorer (USE) - High-performance web explorer and audit tool for ZFS, Btrfs and POSIX snapshots"
authors = [
    { name = "Nicolas Göddel", email = "github@goeddel.net" }
]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPLv3" }
dependencies = [
    "fastapi>=0.135.3",
    "jinja2>=3.1.6",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.1",
    "pydantic>=2.0",
    "uvicorn>=0.44.0",
    "lucide>=1.1.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "ruff>=0.9.0",
    "coverage>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
use = "goeddel.use.server:start"
snapshot-explorer = "goeddel.use.server:start"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goeddel"]

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
]
